name: tradebot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tradebot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bot ausfuehren
        run: node bot.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Zustand speichern
        run: |
          git config user.name "tradebot-bot"
          git config user.email "tradebot-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase -q && git push)
